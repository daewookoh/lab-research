# 상품 카테고리 체계 v0.1 — 소상공인 장기재고 재유통 대상 품목
# 백로그: D002 / 작성일: 2026-10-29 / 작성: AI 연구보조(Claude) 초안, 연구책임자 승인 전
#
# 구조: 대분류(level1) > 중분류(level2) > 소분류(level3). 소분류 30개.
# 코드 규칙: 대분류 2자, 중분류 "대분류-2자", 소분류 "중분류-3자". 코드는 영구 불변, 이름은 바꿀 수 있음.
#
# 소분류 공통 속성 (합성 데이터 생성·Re-Flow Score 항목과 연결하기 위해 미리 둠)
#   expiry_class : none | long | medium | short
#       none   = 유통기한 개념 없음 (의류·공구 등)
#       long   = 사용기한·권장기간 있으나 1년 이상 (세제·화장품 미개봉·문구 등)
#       medium = 6~18개월 (대부분의 가공식품·건강기능식품)
#       short  = 6개월 미만 (일부 음료·즉석식품)  → 판매속도·상품잔존성 항목에 직접 영향
#   seasonality  : [] | summer | winter | holiday(명절·연말) | school(신학기) | spring_fall
#       → 시즌성 피처(D027)와 시장수요 항목의 기초
#   size_class   : small | medium | large   (택배 1박스 기준: small=여러 개 합포장 가능, large=개별 대형)
#       → 물류효율성 항목의 기초
#   regulation   : none | labeling | permit
#       none     = 재판매에 별도 제약 없음
#       labeling = 사용기한·성분·KC 등 표시사항 확인 필요 (화장품·식품·전기용품 등)
#       permit   = 판매업 신고·허가 등 자격 요건 가능 (건강기능식품·의료기기 등) → 채널적합성 제약
#   examples     : 소상공인 입력 텍스트에서 자주 보일 상품명 예시 (과제2 추출 테스트용 어휘 시드)

