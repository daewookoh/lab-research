    legal_notes: >
      제휴(affiliate) 수익 프로그램용 API. 파트너스 가입·승인 필요. 파트너스 약관의 데이터 저장·용도 조항은 오늘 미확인(partners.coupang.com 미열람).
      쿠팡 사이트 이용약관(np/policies/terms)은 접근 실패로 미확인. 쿠팡 robots.txt 는 User-agent: * 전체 Disallow(2차 자료, 2026-10-04 기준).
    limits: >
      HMAC-SHA256(CEA) 인증. 상품검색 limit 최대 10건/호출, "1분당 최대 50번"(README) vs "1시간 30회 이상 호출 시 24시간 정지, 3회 정지 시 계정 정지"(README 주의사항) — 상충, 어느 쪽이 적용되는지 미확정.
      응답: keyword·rank·isRocket·isFreeShipping·productId·productImage·productName·productPrice·productUrl (categoryName 은 검색 응답에 없음).
    verified: false
    verified_on: "2026-11-24"
    evidence:
      - https://www.pkgstats.com/pkg:n8n-nodes-coupang-partners
      - https://raw.githubusercontent.com/NomaDamas/k-skill/main/docs/features/coupang-product-search.md
      - https://www.digitalmarketer.co.kr/insights/coupang-robots-txt-partners-strategy
    note: >
      공식 문서(partners.coupang.com/#help/open-api)를 읽지 못해 3자 README 기준. 호출당 10건이라 분포(min/median/max)가 아니라 상위 10개 등록가만 얻음. 제휴 목적 외 사용이 약관상 허용되는지가 관건.
