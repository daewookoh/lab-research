  - platform: price_go_kr
    name: 한국소비자원 참가격 생필품 가격정보 (공공데이터포털)
    channel: offline_store
    access: file
    price_type: sale
    condition: [new]
    covers: [FD, LV, BT, HB]
    sold_count: false
    tos_status: clear
    legal_notes: >
      공공데이터포털 이용허락범위 "제한 없음", 비용 무료(파일 15083256). GW 오픈API(15158701) 는 "공공저작물 출처표시(제1유형)".
      파일 다운로드는 로그인 없이 가능, 오픈API 는 활용신청 필요(심의 유형 미확인).
    limits: >
      파일 월간 갱신(2026-09-25 스냅샷 235,632행, 차기 등록 예정 2026-11-13 표기), API 트래픽 한도 미기재.
      필드: 상품명(GOOD_NAME)·조사일·판매가격(원)·판매업소(SORE_NAME)·제조사·세일여부·원플러스원. API 조회는 업체ID 또는 상품ID 중 하나 필수.
    verified: true
    verified_on: "2026-11-24"
    evidence:
      - https://www.data.go.kr/data/15083256/fileData.do
      - https://www.data.go.kr/catalog/15158701/openapi.json
    note: >
      오프라인 소매(판매업소명만 있고 대형마트·SSM·전통시장 구분은 페이지에 없음) 실판매가. 품목 수·판매처 유형은 페이지에 미기재 — CSV 를 받아 세어야 함(이 환경은 포털 파일 다운로드 불가).
      우리 상품(장기재고)의 "정상 소매가" 기준선 용도. 온라인 등록가가 아니므로 market_price.channel=offline_store 로 기록.
    priority: 1

  - platform: naver_apihub_shop
    name: 네이버 API HUB 쇼핑 검색 (구 개발자센터 /v1/search/shop)
    channel: price_comparison
    access: api
    price_type: listing
    condition: [new, used]
    covers: [FD, LV, BT, FA, DE, HO, HB]
    sold_count: false
    tos_status: conditional
    legal_notes: >
      NAVER API 서비스 이용약관(API HUB, 2026-06-24 판, 2026-06-25 시행) 일반조건 7.3③ — API 제공 정보를 허용 범위를 넘어
      "무단으로 복제, 저장(캐시 행위 포함), 가공, 배포" 금지, "각 API 의 제공 취지나 목적에 맞지 않게 API 제공 정보를 저장하거나 이용하는 행위" 금지.
      특약(검색 API) 2.1 — 검색결과를 "독립적으로 노출" 해야 하며 앞·뒤·중간 삽입·왜곡 금지. 7.2② 사용자에게 대가 수취 금지. 7.3④ 결과화면과 광고 동시 노출 금지.
      7.3⑫ 자동화 프로그램 접속·주기적 접속 과부하 금지. "AI 학습 금지"·"크롤링" 문구는 약관 원문에 없음(블로그 2차 해설에만 있음).
      → 시세를 레코드로 축적하는 우리 용도는 7.3③ "저장" 과 충돌 가능. 법무·네이버 측 확인 전엔 conditional.
    limits: >
      API HUB 로 이관(블로그: 2026-09-07; 공식 가이드는 날짜 없음). 한시적 무료, 유료 전환 시 사전 공지. NAVER 검색 카테고리 합산 월 775,000건(일 단위 아님),
      키당 50 RPS, 초과 429. 무료 기간 한도 증량 불가. 인증 헤더 X-NCP-APIGW-API-KEY-ID / X-NCP-APIGW-API-KEY, 도메인 naverapihub.apigw.ntruss.com.
      구 개발자센터 신규 신청 중단(블로그: 2026-07-31)·유예 2027-06-30(블로그, 2차). 공식 사용 가이드(apihub-use)의 검색 API 목록에 "쇼핑" 이 빠져 있어 API HUB 에서 쇼핑 검색 제공 여부 자체가 미확인.
    verified: true
    verified_on: "2026-11-24"
    evidence:
      - https://guide.ncloud-docs.com/docs/apihub-overview
      - https://guide.ncloud-docs.com/docs/apihub-use
      - https://guide.ncloud-docs.com/docs/apihub-spec
      - https://guide.ncloud-docs.com/docs/apihub-migration
      - https://xv-ncloud.pstatic.net/images/provision/NAVER_API_서비스_이용약관_APIHUB_최종_260624_KR_clean_1782291589723.pdf
      - https://brunch.co.kr/@ainote/123
    note: >
      구 명세(오늘 미확인, 기억 기준): query·display(≤100)·start(≤1000)·sort(sim/date/asc/dsc)·filter·exclude, 응답 title·link·image·lprice·hprice·mallName·productId·productType·brand·maker·category1~4.
      응답이 등록가 분포(lprice)와 판매처(mallName)·카테고리를 주므로 우리 스키마의 n_listings·price_min/median/max 를 바로 채울 수 있는 유일한 전 카테고리 소스. 단 약관 7.3③ 때문에 "저장" 가능 여부가 관건.
    priority: 2

