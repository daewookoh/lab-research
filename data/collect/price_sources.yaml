# 시세 데이터 소스 목록 v0.1 — D016 (2026-11-24) / AI 연구보조(Claude) 초안, 연구책임자 승인 전
#
# 목적: market_price.json 의 source.platform enum 후보와, D018 파이프라인 설계·D019 수집기 v1 이 고를 1차 소스를 정한다.
# 각 항목의 evidence 는 2026-11-24 에 실제로 읽은 페이지만 적는다. 읽지 못한 것은 verified: false 로 두고 추정임을 note 에 쓴다.
#
# 필드
#   platform      : market_price.json source.platform 에 넣을 식별자(snake_case, ≤50자)
#   channel       : market_price.json source.channel enum 값
#   access        : api | file | crawler | manual   (market_price.json source.collected_by 와 대응 — file 은 api 로 기록)
#   price_type    : listing(등록가) | sale(실판매가) | asking(중고 호가)
#   condition     : [new] | [used] | [new, used]
#   covers        : 대분류 코드(FD·LV·BT·FA·DE·HO·HB) 중 이 소스에서 시세를 구할 수 있다고 보는 것
#   sold_count    : 플랫폼이 판매량(구매 건수)을 노출하는지 (sold_count_30d 채울 수 있는지)
#   tos_status    : clear(허용 확인) | conditional(허용되나 저장·용도 제약) | prohibited(약관·robots 로 금지) | unknown(미확인)
#   legal_notes   : 약관·robots 근거(조항 번호·문구 요지). 2차 자료는 "(2차)" 로 표시
#   limits        : 호출 한도·비용
#   verified      : 오늘 1차 자료(공식 문서·약관·포털 페이지)를 직접 읽었는지
#   verified_on   : 확인일
#   evidence      : 읽은 URL
#   priority      : D019 1차 수집기 후보 우선순위 (1 높음 ~ 5 낮음, 0 = 후보 아님)

