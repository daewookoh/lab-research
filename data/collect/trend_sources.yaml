  - platform: naver_searchad_keywordstool
    name: 네이버 검색광고 API 키워드도구 (/keywordstool, 월간 검색수 절대치)
    signal: absolute_count
    unit: keyword
    granularity: [month]
    earliest: null
    access: api
    covers: [FD, LV, BT, FA, DE, HO, HB]
    tos_status: unknown
    legal_notes: >
      검색광고 API 약관 미열람. 광고주 계정(사업자)·API 라이선스 발급이 전제(기억 기준, 미확인). 공식 이슈 답변(#1060): Open API 는 QC(검색수)·클릭률·depth 를 제공하고 타게팅 정보는 미제공.
      광고 집행 목적 외(연구용 저장) 사용 허용 여부가 핵심 쟁점이며 미확인.
    limits: >
      기억 기준(미확인): 응답 keywordList[].monthlyPcQcCnt·monthlyMobileQcCnt(최근 1개월, 10 미만은 "< 10" 문자열), 호출당 hintKeywords 최대 5개, 연관 키워드 포함 반환. 일 한도 미확인.
    verified: false
    verified_on: "2026-11-25"
    evidence:
      - https://github.com/naver/searchad-apidoc/issues/1060
    note: >
      유일한 "절대치" 소스. 데이터랩 상대지수를 절대 검색수로 바꾸는 척도(앵커의 월간 검색수)로 쓰면 소분류 간 수요 크기 비교가 가능해진다.
      최근 1개월만 주므로 시계열은 매월 수집해 쌓아야 한다. 검색광고 계정 보유 여부를 연구책임자에게 질문.
    priority: 3

