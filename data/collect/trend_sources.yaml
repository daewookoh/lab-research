# 검색 트렌드 데이터 소스 목록 v0.1 — D017 (2026-11-25) / AI 연구보조(Claude) 초안, 연구책임자 승인 전
#
# 목적: market_price.json 의 search_index(0~100, "네이버 데이터랩식 상대 지수", D017 전까지 자리만 둠)를 어떤 소스로
#       채울지, 그 소스를 자동 수집해 저장하는 것이 약관상 허용되는지, 소분류 30개 중 몇 개를 덮는지를 정한다.
# 각 항목의 evidence 는 2026-11-25 에 실제로 읽은 페이지만 적는다. 읽지 못한 것은 verified: false 로 두고 추정임을 note 에 쓴다.
# price_sources.yaml(D016) 과 같은 규칙: 2차 자료는 "(2차)", 기억에 의존한 것은 "기억 기준, 미확인".
#
# 필드
#   platform      : 식별자(snake_case, ≤50자). market_price.search_index 의 출처를 notes 에 적을 때 쓰는 이름
#   signal        : relative_index(기간 내 최대=100 상대지수) | click_index(쇼핑 클릭 상대지수) | absolute_count(월간 검색수 절대치) | sales_amount(거래액)
#   unit          : keyword(검색어 단위) | category(쇼핑 카테고리 단위) | product_group(통계 상품군 단위)
#   granularity   : [date, week, month] 중 제공되는 것
#   earliest      : 조회 가능 시작일
#   access        : api | file | crawler | manual
#   covers        : 대분류 코드(FD·LV·BT·FA·DE·HO·HB) 중 이 소스로 수요 신호를 만들 수 있다고 보는 것
#   tos_status    : clear | conditional | prohibited | unknown  (price_sources.yaml 과 같은 정의)
#   legal_notes   : 약관·정책 근거(조항 번호·문구 요지)
#   limits        : 호출 한도·비용·요청 제약
#   verified      : 오늘 1차 자료(공식 문서·약관)를 직접 읽었는지
#   evidence      : 읽은 URL
#   priority      : search_index 소스 후보 우선순위 (1 높음 ~ 5 낮음, 0 = 후보 아님)

version: "0.1"
defined_on: "2026-11-25"
status: draft

sources:

  - platform: naver_datalab_search
    name: 네이버 API HUB 데이터랩 검색어 트렌드 (POST /search-trend/v1/search)
    signal: relative_index
    unit: keyword
    granularity: [date, week, month]
    earliest: "2016-01-01"
    access: api
    covers: [FD, LV, BT, FA, DE, HO, HB]
    tos_status: conditional
    legal_notes: >
      D016 에서 읽은 NAVER API 서비스 이용약관(API HUB, 2026-06-24 판) 이 그대로 적용된다 — 7.3③ API 제공 정보의 허용 범위 밖
      "복제, 저장(캐시 행위 포함), 가공, 배포" 금지, "각 API 의 제공 취지나 목적에 맞지 않게 API 제공 정보를 저장하거나 이용하는 행위" 금지.
      검색어 트렌드 문서 자체에는 저장·캐시·용도 조항이 없고(오늘 확인), 데이터랩 전용 특약이 있는지는 미확인.
      → ratio 를 상품·일자별 search_index 레코드로 축적하는 우리 용도는 시세 저장과 같은 쟁점. 네이버 클라우드 서면 확인 전 conditional.
    limits: >
      요청: startDate(2016-01-01 이후)·endDate·timeUnit(date|week|month) 필수, keywordGroups 최대 5쌍, 쌍당 keywords 최대 20개,
      device(pc|mo)·gender(m|f)·ages("1"~"11", 11구간) 선택. 응답 ratio = "구간별 결과에서 가장 큰 값을 100으로 설정한 상댓값" —
      최대 100 이 요청 전체 기준인지 그룹별인지 문서에 명시 없음(예시 응답은 요청 전체 기준으로 읽힘, 샘플 호출로 확인 필요).
      한도: 상태 429 "하루 허용량 초과" 라고만 적혀 있고 숫자는 문서에 없음. D016 가이드(apihub-use) 기준 데이터랩 월 50,000건(오늘 재확인 실패 — 승인 제약).
      요금 페이지(ncloud.com/product/applicationService/NAVER API HUB) 미열람. 인증 X-NCP-APIGW-API-KEY-ID / X-NCP-APIGW-API-KEY.
      날짜 범위 상한·일 단위 조회 시 최대 기간은 문서에 없음.
    verified: true
    verified_on: "2026-11-25"
    evidence:
      - https://api.ncloud-docs.com/docs/naver-api-hub-search-trend.md
      - https://api.ncloud-docs.com/docs/naver-api-hub-search-trend-examples
      - https://api.ncloud-docs.com/docs/naver-api-hub-overview
    note: >
      search_index 1순위. 상대지수라 호출 간 비교 불가 → 모든 호출에 같은 앵커 키워드 그룹을 넣어 앵커 기준으로 재척도(src/collect/trend_naver.py).
      소분류 30개를 키워드 그룹으로 묶으면 호출당 4 소분류 + 앵커 1 = 8 호출/회차. 일간 지수 월 1회 갱신이면 월 8건, 주 1회면 32건 — 한도 걱정 없음.
      문서 갱신일 2026-11-24. 샘플 호출은 API HUB 키가 없어 미수행(blocked).
    priority: 1

  - platform: naver_shopping_insight_cat
    name: 네이버 API HUB 데이터랩 쇼핑인사이트 분야별 트렌드 (POST /shopping/v1/categories)
    signal: click_index
    unit: category
    granularity: [date, week, month]
    earliest: "2017-08-01"
    access: api
    covers: [FD, LV, BT, FA, DE, HO, HB]
    tos_status: conditional
    legal_notes: >
      naver_datalab_search 와 같은 약관(7.3③ 저장·가공 금지). 쇼핑인사이트 문서에도 저장·용도 조항 없음(오늘 확인).
    limits: >
      category 최대 3쌍(name + param[cat_id 배열]), startDate 2017-08-01 이후, timeUnit date|week|month, device·gender·ages(10~60, 6구간) 선택.
      ratio = "구간별 클릭량의 상대적 비율 - 구간별 결과에서 가장 큰 값을 100으로 설정한 상댓값". cat_id 는 "네이버쇼핑에서 카테고리 선택 시 URL 의 cat_id 파라미터" 로만 안내 — 코드표 API 없음.
      한도 숫자 문서에 없음(429 하루 허용량 초과).
    verified: true
    verified_on: "2026-11-25"
    evidence:
      - https://api.ncloud-docs.com/docs/naver-api-hub-shopping-insight-categories.md
      - https://api.ncloud-docs.com/docs/naver-api-hub-shopping-insight-examples.md
    note: >
      검색이 아니라 네이버쇼핑 안의 "클릭" 이라 구매 의도에 더 가깝다. 단위가 네이버쇼핑 카테고리라 우리 소분류 30개 ↔ cat_id 대응표가 필요하고,
      cat_id 는 네이버쇼핑 화면에서 사람이 하나씩 받아 적어야 한다(trend_keywords.yaml 의 naver_shop_cat_id 가 전부 null 인 이유). 호출당 3개라 30 소분류 = 10 호출(앵커 포함 15 호출).
      소분류 단위 시즌 지수(D027)의 후보.
    priority: 2

