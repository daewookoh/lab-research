# 소분류 30개 → 검색 트렌드 키워드 그룹 매핑 v0.1 — D017 (2026-11-25) / AI 연구보조(Claude) 초안, 연구책임자 승인 전
#
# 용도: 네이버 데이터랩 검색어 트렌드(naver_datalab_search) 호출의 keywordGroups 를 만든다.
#   - groupName = 소분류 코드, keywords = categories.yaml examples 에서 수량·규격을 뗀 검색어(≤20개).
#   - anchor: 모든 호출에 같이 넣는 기준 키워드 그룹. ratio 가 "요청 안의 최대값 = 100" 인 상대지수라
#     호출이 다르면 비교가 안 되므로, 앵커의 ratio 로 나눠 "앵커 대비 배수" 로 재척도한다(src/collect/trend_naver.py).
#     앵커는 (1) 어느 소분류에도 속하지 않고 (2) 시즌성이 약하며 (3) 품목 키워드와 검색량 자릿수가 비슷한 것을 고른다 — "생수" 는 가정이며 샘플 호출 후 교체 가능.
#   - naver_shop_cat_id: 쇼핑인사이트(naver_shopping_insight_*) 용 네이버쇼핑 카테고리 코드. 공식 문서가 "네이버쇼핑 URL 의 cat_id 로 확인" 이라고만
#     안내하고 코드표 API 가 없어 전부 null — 연구책임자(또는 키 발급 후 담당자)가 화면에서 받아 적어야 한다. 예시 코드 50000000(패션의류)·50000002(화장품/미용)는 공식 문서 예시.
#
# 주의: 키워드 선정은 examples 어휘 기준의 가정이다. 실제 소상공인 재고 품목명(실데이터·과제2 입력)이 오면 다시 뽑는다.

